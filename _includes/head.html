<head>
    <link href="http://gmpg.org/xfn/11" rel="profile">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">

    <!-- Enable responsiveness on mobile devices-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

    <!-- Fetch the logo font early, from this site rather than Google Fonts. -->
    <link rel="preload" href="{{ "/public/fonts/megrim/megrim-latin-v18.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z9LG56LVWM"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-Z9LG56LVWM');
    </script>

    <title>
        {% if page.title == "Home" %}
        {{ site.title }} &middot; {{ site.tagline }}
        {% else %}
        {{ page.title }} &middot; {{ site.title }}
        {% endif %}
    </title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ "/public/css/styles.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/public/css/poole.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/public/css/syntax.css" | relative_url }}">
    <!-- Refresh the logo styles after each deployment, including the local font definition. -->
    <link rel="stylesheet" href="{{ "/public/css/hyde.css" | relative_url }}?v={{ site.time | date: '%s' }}">
    <script>
        // Reserve the logo's space while the font loads, without showing a fallback.
        // If loading fails (or the API is unavailable), keep the home link usable.
        if (document.fonts && document.fonts.load) {
            document.documentElement.classList.add('logo-font-loading');
            document.fonts.load('bold 1em "Megrim"', {{ site.title | jsonify }}).then(function (faces) {
                // An empty result means no @font-face matched; it is not a successful load.
                if (faces.length === 0) {
                    console.warn('The Megrim logo font definition is missing from the stylesheet.');
                }
                document.documentElement.classList.remove('logo-font-loading');
            }, function () {
                document.documentElement.classList.remove('logo-font-loading');
            });
        }
    </script>

    <!-- Icons -->
    <!-- <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ site.baseurl }}public/apple-touch-icon-144-precomposed.png">
                                   <link rel="shortcut icon" href="{{ site.baseurl }}public/favicon.ico"> -->

</head>
